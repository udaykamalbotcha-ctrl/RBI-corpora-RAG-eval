name: Regulatory RAG Quality Regression Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rag-gate:
    name: Evaluate RAG Quality Gates
    runs-on: ubuntu-latest

    # <<< KEEP THIS env block <<< 
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      # --------------------------------------------------
      # 1️⃣ Checkout the repo
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2️⃣ Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3️⃣ Install dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4️⃣ Run the experiment (produces the JSON report)
      # --------------------------------------------------
      - name: Run experiment (produce report)
        run: |
          # You can run the full suite or a quick smoke test.
          # For a quick smoke, add a subset flag if your script supports it.
          python eval/experiment_runner.py

      # --------------------------------------------------
      # 5️⃣ Run the CI quality‑gate script (checks thresholds)
      # --------------------------------------------------
      - name: Run CI Quality Regression Gate
        run: |
          python eval/ci_gate.py